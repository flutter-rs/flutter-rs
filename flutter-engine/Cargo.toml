[package]
name = "flutter-engine"
version.workspace = true
authors = ["juju <gliheng@gmail.com>", "Sophie Tauchert <sophie@999eagle.moe>"]
edition.workspace = true
rust-version.workspace = true
description = "Flutter engine embedder in rust."
keywords.workspace = true
categories = ["gui", "api-bindings"]
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flutter-engine"
license.workspace = true

[dependencies]
crossbeam-channel.workspace = true
flutter-engine-sys.workspace = true
gl = { workspace = true, optional = true }
image = { workspace = true, optional = true }
log.workspace = true
parking_lot.workspace = true
priority-queue.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
# `dep:` keeps `gl` and `image` from becoming public features of their own:
# enabling either alone does not configure the texture helpers.
gl-helpers = ["dep:gl", "dep:image"]

[lints]
workspace = true
