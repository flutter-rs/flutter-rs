# cargo-deny configuration — see https://embarkstudios.github.io/cargo-deny/
#
# `cargo deny check advisories licenses bans sources` runs in CI
# (.github/workflows/ci.yml, job `deny`). Run it locally the same way:
#
#     cargo install cargo-deny --locked
#     cargo deny check advisories licenses bans sources
#
# Checked with cargo-deny 0.20.2 against the committed Cargo.lock.

[graph]
# The engine is a desktop embedder; these are the targets the workspace is
# actually built for, so the graph (and the license set) stays honest.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Give every entry a dated rationale: ignore = [{ id = "RUSTSEC-0000-0000",
# reason = "…, revisit YYYY-MM-DD" }]
#
# The three below are the same advisory three times over: zbus 6.0 absorbed
# zvariant, zvariant_derive and zbus_names into itself, so the standalone
# crates are unmaintained by definition rather than defective. They are not
# `unsound` or `vulnerability` advisories and there is no safe upgrade: we
# reach them only through dark-light 3.0.0 -> zbus 5.19, dark-light 3.0.0 is
# its latest release, and it pins zbus 5. flutter-glfw uses dark-light for one
# thing — the host's light/dark preference on `flutter/settings` — and does
# not touch the D-Bus wire types itself.
#
# Revisit 2026-04-25, or sooner if dark-light cuts a release on zbus 6. If it
# has not by then, the alternatives are a direct zbus 6 dependency reading
# `org.freedesktop.portal.Settings.ReadOne("org.freedesktop.appearance",
# "color-scheme")` (~30 lines, same transitive cost), or dropping the feature
# and leaving `platformBrightness` at the framework's default.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6 as its `wire` module; reached only via dark-light 3 -> zbus 5, which has no 6.x release to move to. Revisit 2026-04-25." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; reached only via dark-light 3 -> zbus 5, which has no 6.x release to move to. Revisit 2026-04-25." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; reached only via dark-light 3 -> zbus 5, which has no 6.x release to move to. Revisit 2026-04-25." },
    { id = "RUSTSEC-2024-0436", reason = "paste is a proc-macro crate with no runtime code; it reaches the graph only through the macOS-only metal 0.33 bindings used by the experimental Metal renderer. The maintained alternative is objc2-metal; replacing metal is the planned follow-up. Revisit 2027-06-01." },
]

[licenses]
version = 2
# Every licence in the current graph, nothing speculative.
allow = [
    "Apache-2.0",
    "BSD-3-Clause",        # bindgen
    "ISC",                 # libloading
    "MIT",
    "MPL-2.0",             # see below
    "Unicode-3.0",         # tinystr, unicode-ident
    "Zlib",                # glfw-sys, zlib-rs, raw-window-handle
    "zlib-acknowledgement", # tinyfiledialogs
]
# priority-queue is `LGPL-3.0-or-later OR MPL-2.0`; take MPL-2.0 so flutter-rs
# stays MIT-licensable. MPL-2.0 is weak, file-level copyleft: it obliges you to
# publish changes to *those files*, not to your own crate. Also reached
# unconditionally through dirs -> dirs-sys -> option-ext, which is MPL-2.0 only.
[[licenses.clarify]]
crate = "priority-queue"
expression = "MPL-2.0"
license-files = []

[bans]
# The engine graph legitimately carries duplicate majors through transitive
# dependencies we do not control (bitflags 1/2, libloading 0.8/0.9, …), which
# is also why [workspace.lints.clippy] allows multiple_crate_versions. Warn so
# the list stays visible without blocking a merge.
multiple-versions = "warn"
wildcards = "deny"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
