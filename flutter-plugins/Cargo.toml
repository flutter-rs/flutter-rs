[package]
name = "flutter-plugins"
version.workspace = true
authors = ["juju <gliheng@gmail.com>"]
edition.workspace = true
rust-version.workspace = true
description = "flutter-rs plugins"
keywords.workspace = true
categories = ["gui"]
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/flutter-plugins"
license.workspace = true
readme = "../README.md"

[dependencies]
flutter-engine.workspace = true
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
thiserror.workspace = true
tinyfiledialogs = { workspace = true, optional = true }
unic-locale.workspace = true

[features]
default = ["dialog"]
# The file/message dialog plugin vendors C sources through `cc`; opt out of it
# for builds that cannot run a C compiler.
dialog = ["dep:tinyfiledialogs"]

[lints]
workspace = true
